<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 26h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="16" cy="15" r="7" fill="currentColor"/>
        <circle cx="19" cy="12.5" r="1.3" fill="var(--surface-1)"/>
        <path d="M23 14l4 1.5-4 1.5z" fill="currentColor"/>
        <path d="M14 22l0 4M18 22l0 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <h1>Perch</h1>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="roost" class="on">Roost</button>
      <button data-view="stats">Analytics</button>
    </nav>
    <div class="topright">
      <div class="topstats" id="topstats"></div>
      <select id="theme" class="themepick" aria-label="Theme">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="dracula">Dracula</option>
        <option value="cappuccino">Cappuccino</option>
        <option value="catppuccin">Catppuccin</option>
      </select>
    </div>
  </header>

  <main id="grid" class="grid" aria-live="polite"></main>
  <section id="stats" class="statswrap" hidden></section>
  <div id="tip" class="tip" hidden></div>

  <div id="toast" class="toast" role="status"></div>

  <footer class="pagefoot">
    <span id="freshness"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
