<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 26h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="16" cy="15" r="7" fill="currentColor"/>
        <circle cx="19" cy="12.5" r="1.3" fill="var(--surface-1)"/>
        <path d="M23 14l4 1.5-4 1.5z" fill="currentColor"/>
        <path d="M14 22l0 4M18 22l0 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <h1>Perch</h1>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="roost" class="on">Roost</button>
      <button data-view="stats">Analytics</button>
    </nav>
    <button id="bcastbtn" class="bcastbtn" title="Send one prompt to many agents">Broadcast <kbd id="bcastkbd"></kbd></button>
    <div class="topright">
      <div class="topstats" id="topstats"></div>
      <button id="spawnbtn" class="iconbtn" title="New agent — ⌘⇧A" aria-label="New agent">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 1a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2H9v5a1 1 0 1 1-2 0V9H2a1 1 0 1 1 0-2h5V2a1 1 0 0 1 1-1z"/></svg>
      </button>
      <a class="gh" href="https://github.com/catoenm/perch" target="_blank" rel="noopener" title="Perch on GitHub" aria-label="Perch on GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <select id="theme" class="themepick" aria-label="Theme">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="dracula">Dracula</option>
        <option value="cappuccino">Cappuccino</option>
        <option value="catppuccin">Catppuccin</option>
      </select>
    </div>
  </header>

  <div id="spawnbar" class="bcastbar" hidden>
    <div class="acwrap">
      <input id="spawndir" type="text" autocomplete="off" placeholder="Project directory — e.g. ~/Documents/workspace/backend" />
      <div id="spawnsuggest" class="suggest" hidden></div>
    </div>
    <button id="spawntab">Tab</button>
    <button id="spawngo" class="primary">New window</button>
    <button id="spawncancel" title="Cancel">✕</button>
    <span class="hint">opens Ghostty there and runs claude · the bird appears here once it hatches</span>
  </div>
  <div id="bcastbar" class="bcastbar" hidden>
    <input id="bcasttext" type="text" placeholder="Prompt to send — e.g. unblock your GPG and commit" />
    <button id="bcastsend" class="primary" disabled>Send</button>
    <button id="bcastall">All</button>
    <button id="bcastwaiting">Waiting</button>
    <button id="bcastcancel" title="Cancel">✕</button>
    <span class="hint">click cards to select · sends and submits immediately · esc closes</span>
  </div>
  <main id="grid" class="grid" aria-live="polite"></main>
  <section id="stats" class="statswrap" hidden></section>
  <div id="tip" class="tip" hidden></div>

  <div id="toast" class="toast" role="status"></div>

  <div id="peek" class="overlay" hidden>
    <div class="drawer" role="dialog" aria-modal="true">
      <div class="drawer-head">
        <div class="drawer-avatar" id="peekavatar"></div>
        <div class="drawer-id">
          <h2 id="peektitle"></h2>
          <div class="path" id="peeksub"></div>
        </div>
        <button id="peekjump" title="Jump to terminal">terminal ↗</button>
        <button id="peekclose" title="Close" aria-label="Close">✕</button>
      </div>
      <div class="drawer-body" id="peekbody"></div>
      <div class="drawer-foot">
        <input id="peekinput" type="text" maxlength="4000" placeholder="Send a prompt — Enter submits it" />
        <button id="peeksend">Send</button>
      </div>
    </div>
  </div>

  <footer class="pagefoot">
    <span id="freshness"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
